name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # pretest compiles and lints. The suite runs inside a downloaded VS Code, which needs a display.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        id: package
        run: |
          npx @vscode/vsce package
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.vsix }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
